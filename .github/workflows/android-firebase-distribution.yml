name: Build Android and Upload to Firebase App Distribution

on:
  push:
    branches: [ main, Testing ]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "android/**"
      - ".github/workflows/android-firebase-distribution.yml"
  workflow_dispatch:

# ci: no-op touch to retrigger Testing build

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'

      - name: Decode Android keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create android/key.properties
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/keystore.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Dump pub resolution diagnostics
        run: |
          echo '--- pubspec.lock ---'
          sed -n '1,200p' pubspec.lock || true
          echo '--- .dart_tool/package_config.json ---'
          sed -n '1,200p' .dart_tool/package_config.json || true
          echo '--- list lib/kingdom/widgets ---'
          ls -la lib/kingdom/widgets || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Install Firebase CLI
        run: |
          curl -sL https://firebase.tools | bash

      - name: "Preflight: verify APK and Firebase access"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -e
          echo "APK listing:"
          ls -l build/app/outputs/flutter-apk || true
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "Firebase CLI version:"
          firebase --version
          echo "Listing Firebase apps in project kingdom-ac44f (should include the Android app)"
          firebase apps:list --project kingdom-ac44f --token "$FIREBASE_TOKEN" || true

      - name: "Preflight: print FIREBASE_APP_ID prefix"
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -n "$FIREBASE_APP_ID" ]; then
            echo "FIREBASE_APP_ID prefix: ${FIREBASE_APP_ID:0:6}******"
          else
            echo "FIREBASE_APP_ID is empty (check Actions secret mapping)"
          fi

      - name: "Upload APK to Firebase App Distribution"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS_GROUP: ${{ secrets.FIREBASE_TESTERS_GROUP }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          set -e
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "FIREBASE_APP_ID is not set. Add it as a GitHub Actions secret." >&2
            exit 1
          fi
          if [ -n "$FIREBASE_TESTERS_GROUP" ]; then
            firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --groups "$FIREBASE_TESTERS_GROUP" \
              --token "$FIREBASE_TOKEN" \
              --debug
          elif [ -n "$FIREBASE_TESTERS" ]; then
            firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --testers "$FIREBASE_TESTERS" \
              --token "$FIREBASE_TOKEN" \
              --debug
          else
            echo "Set either FIREBASE_TESTERS_GROUP or FIREBASE_TESTERS as a secret." >&2
            exit 1
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
