name: Build Android and Upload to Firebase App Distribution

on:
  push:
    branches: [ main, Testing ]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "android/**"
      - ".github/workflows/android-firebase-distribution.yml"
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'

      - name: Decode Android keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create android/key.properties
        run: |
          # Use printf to avoid heredoc indentation issues
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=app/keystore.jks\n" \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" > android/key.properties

      - name: "Preflight: signing keystore fingerprints (SHA-1/SHA-256)"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            echo "### Signing keystore fingerprints";
            echo "Alias: $ANDROID_KEY_ALIAS";
            keytool -list -v -keystore android/app/keystore.jks -alias "$ANDROID_KEY_ALIAS" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" 2>/dev/null | \
              grep -E 'SHA1:|SHA256:' || true;
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Get dependencies
        run: flutter pub get

      - name: Dump pub resolution diagnostics (light)
        run: |
          echo 'pubspec.lock (head):'
          sed -n '1,40p' pubspec.lock || true

      - name: Build release APK
        run: flutter build apk --release

      - name: "Preflight: APK signing fingerprints (SHA-1/SHA-256)"
        run: |
          {
            echo "### APK signing fingerprints";
            keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk 2>/dev/null | \
              grep -E 'SHA1:|SHA256:' || true;
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Firebase CLI
        run: |
          curl -sL https://firebase.tools | bash

      - name: "Preflight: verify APK and Firebase access"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "APK listing:"
          ls -l build/app/outputs/flutter-apk || true
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "Firebase CLI version:"
          firebase --version || true
          echo "Listing Firebase apps in project kingdom-ac44f (should include the Android app)"
          firebase apps:list --project kingdom-ac44f --token "$FIREBASE_TOKEN" || true

      - name: "Preflight: print FIREBASE_APP_ID prefix"
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -n "$FIREBASE_APP_ID" ]; then
            echo "FIREBASE_APP_ID prefix: ${FIREBASE_APP_ID:0:6}******"
          else
            echo "FIREBASE_APP_ID is empty (check Actions secret mapping)"
          fi

      - name: "Upload APK to Firebase App Distribution"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS_GROUP: ${{ secrets.FIREBASE_TESTERS_GROUP }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          set -e
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "FIREBASE_APP_ID is not set. Add it as a GitHub Actions secret." >&2
            exit 1
          fi
          if [ -n "$FIREBASE_TESTERS_GROUP" ]; then
            firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --groups "$FIREBASE_TESTERS_GROUP" \
              --token "$FIREBASE_TOKEN" \
              --debug
          elif [ -n "$FIREBASE_TESTERS" ]; then
            firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --testers "$FIREBASE_TESTERS" \
              --token "$FIREBASE_TOKEN" \
              --debug
          else
            echo "Set either FIREBASE_TESTERS_GROUP or FIREBASE_TESTERS as a secret." >&2
            exit 1
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
