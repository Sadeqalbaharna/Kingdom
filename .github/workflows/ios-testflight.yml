name: iOS TestFlight Distribution

on:
  push:
    branches: [ main, Testing ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    name: Build and Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      FLUTTER_CHANNEL: stable
      # Optional: Comma-separated TestFlight groups (for external testers). If omitted, upload is for processing/internal testers.
      TESTFLIGHT_GROUPS: ${{ secrets.TESTFLIGHT_GROUPS }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_CHANNEL }}
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Xcode and Flutter diagnostics
        run: |
          xcodebuild -version
          swift --version || true
          flutter --version
          flutter doctor -v

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      - name: Install signing certificate
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$IOS_CERT_P12_BASE64" ] || [ -z "$IOS_CERT_PASSWORD" ]; then
            echo "iOS signing certificate secrets are not set. Please add IOS_CERT_P12_BASE64 and IOS_CERT_PASSWORD." >&2
            exit 1
          fi
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          if [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] || [ -z "$IOS_PROFILE_NAME" ]; then
            echo "Provisioning profile secrets are not set. Please add IOS_PROVISIONING_PROFILE_BASE64 and IOS_PROFILE_NAME." >&2
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_NAME.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          echo "Installed provisioning profile at $PROFILE_PATH"

      - name: Create ExportOptions.plist
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          if [ -z "$IOS_BUNDLE_ID" ] || [ -z "$IOS_PROFILE_NAME" ]; then
            echo "IOS_BUNDLE_ID and IOS_PROFILE_NAME must be provided as secrets." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Build IPA (Flutter)
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          flutter build ipa --release --export-options-plist "$RUNNER_TEMP/ExportOptions.plist" --no-tree-shake-icons
          ls -lah build/ios/ipa || true

      - name: Upload IPA as artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

      - name: Install fastlane
        run: sudo gem install fastlane --no-document

      - name: Create App Store Connect API key file
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_BASE64" ]; then
            echo "App Store Connect API key secrets are not set. Please add APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID, APP_STORE_CONNECT_API_KEY_BASE64." >&2
            exit 1
          fi
          echo "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          cat > "$RUNNER_TEMP/asc_api_key.json" <<JSON
          {
            "key_id": "$ASC_KEY_ID",
            "issuer_id": "$ASC_ISSUER_ID",
            "key": "$(sed 's/$/\\n/' "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" | tr -d '\n' | sed 's/\\n/\\n/g')",
            "in_house": false
          }
          JSON
          echo "Wrote API key JSON at $RUNNER_TEMP/asc_api_key.json"

      - name: Upload to TestFlight (internal by default)
        env:
          TESTFLIGHT_GROUPS: ${{ secrets.TESTFLIGHT_GROUPS }}
        run: |
          IPA_PATH=$(ls -1 build/ios/ipa/*.ipa | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found at build/ios/ipa. Build may have failed." >&2
            exit 1
          fi
          if [ -n "$TESTFLIGHT_GROUPS" ]; then
            fastlane pilot upload --ipa "$IPA_PATH" --api_key_path "$RUNNER_TEMP/asc_api_key.json" --groups "$TESTFLIGHT_GROUPS" --skip_submission true --skip_waiting_for_build_processing true
          else
            fastlane pilot upload --ipa "$IPA_PATH" --api_key_path "$RUNNER_TEMP/asc_api_key.json" --skip_submission true --skip_waiting_for_build_processing true
          fi
